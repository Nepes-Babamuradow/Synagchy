services:
  db:
    image: postgres:16
    container_name: synagchy_db
    restart: always
    environment:
      POSTGRES_DB: synagchy
      POSTGRES_USER: nepes
      POSTGRES_PASSWORD: 2704
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepes -d synagchy"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: synagchy_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    environment:
      DB_NAME: synagchy
      DB_USER: nepes
      DB_PASSWORD: 2704
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
  static_volume:
